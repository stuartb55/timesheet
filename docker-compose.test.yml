services:
  db:
    image: postgres:18-alpine@sha256:898c60cb390d1085bc97bdd6a1ae968757421df394b071848b52b1c09c89d6a5
    environment:
      POSTGRES_DB: flexitime_test
      POSTGRES_USER: flexitime
      POSTGRES_PASSWORD: flexitime_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flexitime -d flexitime_test"]
      interval: 1s
      timeout: 2s
      retries: 30
