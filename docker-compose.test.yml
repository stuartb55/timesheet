services:
  db:
    image: postgres:18-alpine@sha256:9a8afca54e7861fd90fab5fdf4c42477a6b1cb7d293595148e674e0a3181de15
    environment:
      POSTGRES_DB: flexitime_test
      POSTGRES_USER: flexitime
      POSTGRES_PASSWORD: flexitime_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flexitime -d flexitime_test"]
      interval: 1s
      timeout: 2s
      retries: 30
