services:
  db:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      POSTGRES_DB: flexitime_test
      POSTGRES_USER: flexitime
      POSTGRES_PASSWORD: flexitime_test
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flexitime -d flexitime_test"]
      interval: 1s
      timeout: 2s
      retries: 30
